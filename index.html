<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b1e1e">

<title>Autentitako | Menú Digital</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6efe5;
  color:#291b15;
  font-family:Arial,sans-serif;
}

header{
  background:#8b1e1e;
  color:white;
  text-align:center;
  padding:20px 15px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:30px;
  font-weight:900;
}

header p{
  margin:5px 0 0;
}

main{
  max-width:720px;
  margin:auto;
  padding:15px;
}

.promo{
  background:#f5c542;
  padding:15px;
  border-radius:15px;
  text-align:center;
  margin-bottom:20px;
  font-size:18px;
}

h2{
  font-size:23px;
  margin-top:25px;
}

.producto{
  background:white;
  border-radius:13px;
  padding:13px;
  margin:9px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 7px #0002;
}

.producto strong{
  font-size:17px;
}

.precio{
  display:block;
  font-size:19px;
  font-weight:bold;
  margin-top:5px;
}

button{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.agregar{
  background:#159447;
  color:white;
}

.carrito{
  background:white;
  border-radius:17px;
  padding:17px;
  margin-top:30px;
  box-shadow:0 2px 10px #0003;
}

.carrito-item{
  border-bottom:1px solid #ddd;
  padding:10px 0;
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.cantidad button{
  background:#eee;
  color:#222;
  padding:5px 9px;
}

.total{
  font-size:20px;
  font-weight:bold;
  line-height:1.6;
  margin-top:15px;
}

select,input{
  width:100%;
  padding:12px;
  margin-top:7px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}

.whatsapp{
  display:block;
  background:#159447;
  color:white;
  text-decoration:none;
  text-align:center;
  padding:14px;
  border-radius:10px;
  font-weight:bold;
  margin-top:15px;
}

.info{
  background:#8b1e1e;
  color:white;
  padding:16px;
  border-radius:14px;
  margin-top:25px;
}

.vacio{
  text-align:center;
  color:#777;
  padding:10px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🌮 AUTENTITAKO</div>
  <p>El verdadero sabor del trompo</p>
</header>

<main>

<div class="promo">
  🔥 <strong>Promoción: 12 tacos de pastor $150</strong>
  <br>
  Arma tu pedido y envíalo directamente por WhatsApp.
</div>

<div id="menu"></div>

<div class="carrito" id="carritoBox">

<h2>🛒 Mi pedido</h2>

<div id="carrito">
  <div class="vacio">Tu carrito está vacío.</div>
</div>

<hr>

<h3>📍 Datos para entrega</h3>

<label>Nombre:</label>
<input id="nombre" type="text" placeholder="Tu nombre">

<label>Dirección:</label>
<input id="direccion" type="text" placeholder="Calle, número y colonia">

<label>Distancia de entrega:</label>

<select id="kilometros" onchange="mostrarPedido()">
  <option value="0">Selecciona kilómetros</option>
  <option value="25">0–3 km — $25</option>
  <option value="40">4–6 km — $40</option>
  <option value="55">7–10 km — $55</option>
  <option value="80">11–15 km — $80</option>
  <option value="95">16–20 km — $95</option>
</select>

<div id="total"></div>

<div id="botonWhatsApp"></div>

</div>

<div class="info">
  📲 <strong>Pedidos por WhatsApp</strong><br>
  814 950 6908
  <br><br>
  📍 Servicio en Torreón, Gómez Palacio y Lerdo
</div>

</main>

<script>

const productos = [

{
categoria:"🌮 Pastor / Trompo",
items:[
["Orden c/4 tacos",75],
["Taco de pastor",25],
["Promoción 12 tacos",150],
["Kilo de carne de trompo",450],
["½ kilo de carne de trompo",250],
["Tortillón de trompo",120],
["Orden de gringas c/3",120],
["Gringa",45],
["Alambre de trompo",250],
["½ platillo de alambre",160]
]
},

{
categoria:"🥩 Bistec de Res",
items:[
["Orden c/4 tacos",95],
["Taco de bistec",25],
["Tortillón de bistec",135],
["Gringas de bistec c/3",135],
["Gringa de bistec",50],
["Platillo Que Me Vez",260],
["Platillo de alambre",260]
]
},

{
categoria:"🍔 Hamburguesas",
items:[
["Hamburguesa Especial",95],
["Salchiburger",80],
["Torta Burger",75],
["Hamburguesa Sencilla",70]
]
},

{
categoria:"🍟 Papas",
items:[
["Papas a la francesa sencillas",40],
["Papas especiales con pastor o boneless",75]
]
},

{
categoria:"🥤 Bebidas",
items:[
["Agua de jamaica 1 L",35],
["Agua de limón 1 L",35],
["Agua de horchata 1 L",35],
["Refresco",35]
]
}

];

let carrito=[];


/* CREAR MENÚ */

function crearMenu(){

const menu=document.getElementById("menu");

productos.forEach(categoria=>{

menu.innerHTML += `<h2>${categoria.categoria}</h2>`;

categoria.items.forEach(producto=>{

const nombre=producto[0];
const precio=producto[1];

menu.innerHTML += `

<div class="producto">

<div>
<strong>${nombre}</strong>
<span class="precio">$${precio}</span>
</div>

<button class="agregar"
onclick="agregarProducto(${JSON.stringify(nombre)},${precio})">
Agregar
</button>

</div>

`;

});

});

}


/* AGREGAR */

function agregarProducto(nombre,precio){

const existente=carrito.find(producto=>producto.nombre===nombre);

if(existente){

existente.cantidad++;

}else{

carrito.push({
nombre:nombre,
precio:precio,
cantidad:1
});

}

mostrarPedido();

document.getElementById("carritoBox")
.scrollIntoView({behavior:"smooth"});

}


/* CAMBIAR CANTIDAD */

function cambiarCantidad(indice,cambio){

carrito[indice].cantidad += cambio;

if(carrito[indice].cantidad<=0){

carrito.splice(indice,1);

}

mostrarPedido();

}


/* MOSTRAR CARRITO */

function mostrarPedido(){

const contenedor=document.getElementById("carrito");

if(carrito.length===0){

contenedor.innerHTML=
'<div class="vacio">Tu carrito está vacío.</div>';

document.getElementById("total").innerHTML="";
document.getElementById("botonWhatsApp").innerHTML="";

return;

}

let subtotal=0;

contenedor.innerHTML="";

carrito.forEach((producto,indice)=>{

const importe=
producto.precio*producto.cantidad;

subtotal+=importe;

contenedor.innerHTML += `

<div class="carrito-item">

<div>
${producto.cantidad} × ${producto.nombre}
<br>
<strong>$${importe}</strong>
</div>

<div class="cantidad">

<button onclick="cambiarCantidad(${indice},-1)">
−
</button>

${producto.cantidad}

<button onclick="cambiarCantidad(${indice},1)">
+
</button>

</div>

</div>

`;

});


/* ENVÍO */

const envio=
Number(document.getElementById("kilometros").value) || 0;

const total=subtotal+envio;

document.getElementById("total").innerHTML=`

<div class="total">

Subtotal: $${subtotal}
<br>

Envío: $${envio}
<br>

💰 TOTAL: $${total}

</div>

`;


/* WHATSAPP */

const nombre=
document.getElementById("nombre").value || "No especificado";

const direccion=
document.getElementById("direccion").value || "No especificada";

const distancia=
document.getElementById("kilometros")
.selectedOptions[0].text;


let detalle="";

carrito.forEach(producto=>{

detalle +=
`${producto.cantidad} x ${producto.nombre} = $${producto.precio*producto.cantidad}\n`;

});


const mensaje=

`Hola Autentitako 👋

Quiero realizar este pedido:

${detalle}

Subtotal: $${subtotal}
Envío: $${envio}
TOTAL: $${total}

👤 Nombre: ${nombre}
📍 Dirección: ${direccion}
🚚 Distancia: ${distancia}`;


const enlace=
"https://wa.me/528149506908?text="
+encodeURIComponent(mensaje);


document.getElementById("botonWhatsApp").innerHTML=`

<a class="whatsapp"
href="${enlace}"
target="_blank">

📲 ENVIAR PEDIDO COMPLETO POR WHATSAPP

</a>

`;

}


crearMenu();

</script>

</body>
</html>
